    <p>每天早起，真的能学到很多知识<br />
人勤心不懒<br />
定当勤奋<br />
我现在在老家，我发现在我那里的这个孩子，跟家人一样，晚上玩手机打游戏，不睡觉<br />
十一点半洗漱，烫脚<br />
第二天十点以后起床，也不吃早饭<br />

大人也这样<br />
一上午荒废了，还能干啥<br />
这样下去，一辈子也能毁了<br />
一点一点纠正吧<br />
我每天四点起床，打坐，学习，他们是看不到的</p>
