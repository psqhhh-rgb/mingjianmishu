    <h1 class="article-title">20260917大乘离文字普光明藏经</h1>
    <div class="article-meta">📅 2026-09-17</div>
    
    <p>善男子，一相法是如来觉。</p>
<p>云何一相？所谓诸法不来不去、非因非缘、</p>
<p>不生不灭、无取无舍、不增不减。</p>
<p>善男子，诸法自性本无所有不可为喻，</p>
<p>非是文辞之所辩说。</p>
<p>如是一法，是诸如来现所觉了。”</p>
<p>——《大乘离文字普光明藏经》</p>
