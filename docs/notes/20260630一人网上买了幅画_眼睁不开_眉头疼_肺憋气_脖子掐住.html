<p>一人网上买了这样两幅画<br />
问我合适挂吗<br />
感应，眼睁不开，眉头疼，肺憋气，脖子掐住<br />
这负场太强了<br />
挂上会出事<br />
问我怎么处理<br />
没开光，直接烧掉就行了<br />
此画会破财，压力大<br />
是的<br />
别以为瓷的，铜的佛像就没有负场<br />
这就是遇见我了，自己又不懂，挂上家人真会出事<br />
怎么还会有掐脖子的感觉，<br />
网上卖不应该有恶念啊</p>
