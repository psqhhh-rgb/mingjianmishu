    <h1 class="article-title">20260707萝卜人参</h1>
    <div class="article-meta">📅 2026-07-07</div>
    
    <p>细雨长且久，灵泽润九州<br />
竟然还在下</p>
<p><img alt="935409e47e78bb7f1bdfca6772d292d0.jpg" src="../assets/935409e47e78bb7f1bdfca6772d292d0.jpg" /></p>
<p>一斤半萝卜参</p>
<p><img alt="09757e351cc6dff7adb19e21e6ec84af.jpg" src="../assets/09757e351cc6dff7adb19e21e6ec84af.jpg" /></p>
<p><img alt="d84dc9c82776d9059da97ae8d2ecd45e.jpg" src="../assets/d84dc9c82776d9059da97ae8d2ecd45e.jpg" /></p>
<p>这坛酒泡了六年了<br />
也是奇怪，那一年去昌邑，路边树下有一颗活着的灵芝<br />
我就捡来了<br />
那么大一棵灵芝，就没人看见吗</p>
<p><img alt="6066a7e57e1082f58fe76d049aa29dbb.jpg" src="../assets/6066a7e57e1082f58fe76d049aa29dbb.jpg" /><img alt="28164f76d5856bae4968c86b1714ec5b.jpg" src="../assets/28164f76d5856bae4968c86b1714ec5b.jpg" /></p>
<p><img alt="4205909484b9fc923fca89613ee2e722.jpg" src="../assets/4205909484b9fc923fca89613ee2e722.jpg" /></p>
<p>这应该叫龙葵吧<br />
可是好东西<br />
师父摘叶子下来打汤[呲牙]<br />
黑星星，以前老家特别多<br />
叶子还可以做汤[疑问][疑问]<br />
是啊，特别是吃火锅的时候烫点这个吃<br />
放点肉</p>
<p><img alt="4c06326f4c9f05f7d2537bb1009516d5.jpg" src="../assets/4c06326f4c9f05f7d2537bb1009516d5.jpg" /></p>
<p><img alt="1d2a604699541128c4e2d7764975f311.jpg" src="../assets/1d2a604699541128c4e2d7764975f311.jpg" /></p>
<p>还治疗肾炎<br />
路上遇见前女同事，<br />
丈夫尿毒症，<br />
儿子三十多了，女方要彩礼三十万，告吹<br />
这日子还咋过<br />
厂里去年七月份就不发工资了<br />
今年发了三个月的，一共五千多块</p>
