    <h1 class="article-title">20260702该管的不管，该顺的不顺 啥事不让干 抑郁调理</h1>
    <div class="article-meta">📅 2026-07-02</div>
    
    <p><img alt="bd4d5dca65afafdeb77c64588423e2ec.jpg" src="../assets/bd4d5dca65afafdeb77c64588423e2ec.jpg" /></p>
<p>盘狼藉<br />
孩子从来我这里，体重增加了八斤<br />
他爸妈开心坏了<br />
这也是一种错觉<br />
吃喝又不用我花钱<br />
我只是带他吃喝<br />
带孩子细节<br />
孩子从网上看，柠檬叶泡水喝<br />
我就给他买了棵柠檬<br />
引导我也不惯他<br />
电瓶车带着出去几里地，挖土<br />
自己栽<br />
反倒很开心<br />
以前，想买小动物，也想栽花草<br />
他妈一瞪眼，啥也不行<br />
该管的不管，该顺的不顺<br />
所以抑郁<br />
啥事不让干<br />
就在房间里不出来，打游戏<br />
也不让，必须出来<br />
又不知道干啥<br />
迷茫迷茫<br />
不就抑郁了<br />
管理严重失误</p>
